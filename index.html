<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Ledger — The East Pacific Public Archive</title>
<style>
  :root{
    --bg:#f2f5fb; --panel:#ffffff; --text:#12203a; --muted:#5b6b85; --line:#dbe3f1;
    --primary:#1A6F34; --primary-2:#155a2b; --ink:#F2F2F0; --accent:#F5E423;
    --mark:#fdf3a0;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#0b1220; --panel:#111a2b; --text:#e7ecf6; --muted:#93a1bb; --line:#22304a;
           --primary:#1A6F34; --primary-2:#155a2b; --ink:#F2F2F0; --accent:#F5E423;
           --mark:#6b5600; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  a{color:var(--primary-2)}
  header{background:linear-gradient(180deg,var(--primary),var(--primary-2));color:var(--ink)}
  .bar{max-width:900px;margin:0 auto;padding:20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .brand{display:flex;align-items:baseline;gap:10px}
  .brand h1{margin:0;font-size:1.6rem;letter-spacing:-.02em;color:var(--ink)}
  .brand .accent{width:44px;height:4px;border-radius:3px;background:var(--accent);display:inline-block;transform:translateY(-4px)}
  .links{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
  .links a{color:var(--ink);text-decoration:none;font-size:14px;font-weight:600;
    padding:8px 13px;border:1px solid rgba(242,242,240,.4);border-radius:999px;opacity:.95}
  .links a:hover{background:rgba(242,242,240,.14);border-color:var(--accent)}
  main{max-width:900px;margin:0 auto;padding:0 20px 60px}
  .searchcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:14px;display:flex;gap:10px;flex-wrap:wrap;margin:22px 0 14px;
    box-shadow:0 6px 20px rgba(26,111,52,.08)}
  .searchcard input{flex:1 1 320px;min-width:0;padding:14px 16px;font-size:16px;
    border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text)}
  .searchcard input:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
  .searchcard select{padding:14px 12px;font-size:15px;border:1px solid var(--line);
    border-radius:10px;background:var(--bg);color:var(--text)}
  .searchcard button{padding:14px 22px;font-size:15px;font-weight:700;border:0;border-radius:10px;
    background:var(--accent);color:#3a2b00;cursor:pointer}
  .searchcard button:hover{filter:brightness(1.05)}
  .adv{margin:0 0 14px}
  .adv summary{cursor:pointer;color:var(--muted);font-size:14px;padding:4px 2px;user-select:none}
  .adv-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:8px}
  .adv-grid label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
  .adv-grid input,.adv-grid select{padding:10px 12px;font-size:14px;border:1px solid var(--line);
    border-radius:9px;background:var(--panel);color:var(--text)}
  .hint{color:var(--muted);font-size:12px;margin:0 2px 10px}
  .hint code{background:var(--accent-soft);padding:1px 5px;border-radius:4px}
  #status{color:var(--muted);margin:2px 2px 14px;min-height:1.3em;font-size:14px}
  #status strong{color:var(--text)}
  #status .dot{opacity:.5;padding:0 6px}
  .hit{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin:12px 0}
  .hit-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
  .badge{--c:#5b6b85;background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--c);
    border:1px solid color-mix(in srgb,var(--c) 38%,transparent);padding:2px 9px;border-radius:999px;font-weight:700}
  .badge.src{--c:#6b7280}
  .chan{font-weight:700;color:var(--text)}
  .date{margin-left:auto}
  .content{margin:10px 0 8px;white-space:pre-wrap;word-break:break-word}
  mark{background:var(--mark);color:inherit;padding:0 2px;border-radius:3px}
  .byline{font-size:13px;color:var(--muted)}
  .atts{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
  .att{font-size:13px;color:var(--primary-2);text-decoration:none;border:1px solid var(--line);
    border-radius:8px;padding:6px 10px}
  .att.img{padding:0;border:0}
  .att.img img{max-height:150px;max-width:100%;border-radius:8px;border:1px solid var(--line);display:block}
  .embeds{display:flex;flex-direction:column;gap:8px;margin:10px 0}
  .embed{display:flex;gap:10px;text-decoration:none;color:inherit;border-left:3px solid var(--primary);
    background:color-mix(in srgb,var(--primary) 7%,transparent);border-radius:6px;padding:8px 10px;font-size:13px}
  .embed img{max-height:80px;border-radius:6px}
  .embed-body{display:flex;flex-direction:column;gap:2px;min-width:0}
  .embed-body strong{color:var(--text)}
  .embed-body span{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .embed .prov{font-size:11px;text-transform:uppercase;letter-spacing:.04em}
  #pager{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:22px;color:var(--muted)}
  #pager button{padding:9px 16px;border:1px solid var(--line);border-radius:9px;background:var(--panel);
    color:var(--text);cursor:pointer;font-size:14px}
  #pager button:disabled{opacity:.45;cursor:default}
  footer{max-width:900px;margin:0 auto;padding:0 20px 44px;color:var(--muted);font-size:13px;text-align:center}
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="brand"><h1>Ledger</h1><span class="accent"></span></div>
    <nav class="links">
      <a href="https://discord.com/invite/the-east-pacific-633351482128728064" target="_blank" rel="noopener">Discord</a>
      <a href="https://forum.theeastpacific.com/" target="_blank" rel="noopener">Forum</a>
      <a href="https://www.theeastpacific.com/" target="_blank" rel="noopener">Website</a>
    </nav>
  </div>
</header>
<main>
  <form class="searchcard" id="searchForm">
    <input id="q" type="search" placeholder="Type something to search the public archive" aria-label="Search the archive" autocomplete="off">
    <select id="branch" aria-label="Filter by branch"><option value="">All branches</option></select>
    <select id="sub" aria-label="Filter by source"><option value="">All sources</option></select>
    <button type="submit">Search</button>
  </form>
  <details class="adv" id="adv">
    <summary>Advanced filters</summary>
    <div class="adv-grid">
      <label>Author<input id="fFrom" type="text" placeholder="e.g. alice" autocomplete="off"></label>
      <label>Channel<input id="fIn" type="text" placeholder="e.g. cabinet" autocomplete="off"></label>
      <label>After<input id="fAfter" type="date"></label>
      <label>Before<input id="fBefore" type="date"></label>
      <label>Has
        <select id="fHas">
          <option value="">anything</option>
          <option value="image">image</option>
          <option value="file">file</option>
          <option value="link">link</option>
          <option value="embed">embed</option>
        </select>
      </label>
    </div>
  </details>
  <p class="hint">You can also type operators: <code>from:</code> <code>in:</code> <code>before:</code> <code>after:</code> <code>during:</code> <code>has:image</code> <code>has:file</code> <code>has:link</code> <code>has:embed</code></p>
  <div id="status" aria-live="polite"></div>
  <div id="results"></div>
  <nav id="pager"></nav>
</main>
<footer>
  Powered by the TEP archive search API. Records are exported from Discord; some channels may not be indexed yet.
</footer>
<script>
(function(){
  const API = "https://tep-archive-search.webmaster-748.workers.dev";
  const PER_PAGE = 10;
  const $ = (id) => document.getElementById(id);
  let state = { q:"", branch:"", sub:"", page:1 };
  let statsData = null;

  function esc(s){
    return String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  }
  function pretty(s){
    return String(s||"").replace(/[-_]/g," ").replace(/\b\w/g, c => c.toUpperCase());
  }
  function highlight(text, q){
    const safe = esc(text);
    if(!q) return safe;
    const rx = new RegExp("(" + q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&") + ")", "ig");
    return safe.replace(rx, "<mark>$1</mark>");
  }
  function snippet(text, q, max){
    text = text || "";
    if(text.length <= max) return text;
    const idx = q ? text.toLowerCase().indexOf(q.toLowerCase()) : -1;
    if(idx < 0) return text.slice(0, max) + "…";
    const start = Math.max(0, idx - Math.floor(max/3));
    const end = Math.min(text.length, start + max);
    return (start>0?"…":"") + text.slice(start, end) + (end<text.length?"…":"");
  }
  function year(s){ return s ? String(s).slice(0,4) : ""; }
  function card(h){
    const src = h.sub && h.sub !== "main" ? `<span class="badge src">${esc(pretty(h.sub))}</span>` : "";
    const atts = (h.attachments || []).map((a) => {
      const name = a.name || "file";
      const isImg = /\.(png|jpe?g|gif|webp|avif|bmp)$/i.test(name);
      const kb = a.size ? ` (${Math.round(a.size / 1024)} KB)` : "";
      return isImg
        ? `<a class="att img" href="${esc(a.url)}" target="_blank" rel="noopener"><img src="${esc(a.url)}" alt="${esc(name)}" loading="lazy"></a>`
        : `<a class="att" href="${esc(a.url)}" target="_blank" rel="noopener">📎 ${esc(name)}${kb}</a>`;
    }).join("");
    const embs = (h.embeds || [])
      .filter((e) => e.title || e.description || e.image)
      .map((e) => `<a class="embed" href="${esc(e.url || "#")}" target="_blank" rel="noopener">
        ${e.image ? `<img src="${esc(e.image)}" alt="" loading="lazy">` : ""}
        <span class="embed-body">
          ${e.title ? `<strong>${esc(e.title)}</strong>` : ""}
          ${e.description ? `<span>${esc(e.description.slice(0, 160))}</span>` : ""}
          ${e.provider ? `<span class="prov">${esc(e.provider)}</span>` : ""}
        </span>
      </a>`).join("");
    return `<article class="hit">
      <div class="hit-top">
        <span class="badge">${esc(pretty(h.branch) || "unknown")}</span>
        ${src}
        <span class="chan">#${esc(h.channel)}</span>
        <span class="date">${esc((h.timestamp||"").slice(0,10))}</span>
      </div>
      ${h.content ? `      <p class="content">${highlight(snippet(h.content, state.hl, 340), state.hl)}</p>` : ""}
      ${atts ? `<div class="atts">${atts}</div>` : ""}
      ${embs ? `<div class="embeds">${embs}</div>` : ""}
      <div class="byline">by ${esc(h.author || "unknown")}</div>
    </article>`;
  }
  function readUrl(){
    const u = new URL(location.href);
    state.q = u.searchParams.get("q") || "";
    state.branch = u.searchParams.get("branch") || "";
    state.sub = u.searchParams.get("sub") || "";
    state.from = u.searchParams.get("from") || "";
    state.in = u.searchParams.get("in") || "";
    state.after = u.searchParams.get("after") || "";
    state.before = u.searchParams.get("before") || "";
    state.has = u.searchParams.get("has") || "";
    state.page = parseInt(u.searchParams.get("page") || "1", 10) || 1;
    $("q").value = state.q;
    $("fFrom").value = state.from; $("fIn").value = state.in;
    $("fAfter").value = state.after; $("fBefore").value = state.before; $("fHas").value = state.has;
    if(state.from || state.in || state.after || state.before || state.has) $("adv").open = true;
  }
  function writeUrl(){
    const u = new URL(location.href);
    const set = (k, v) => { if(v) u.searchParams.set(k, v); else u.searchParams.delete(k); };
    set("q", state.q); set("branch", state.branch); set("sub", state.sub);
    set("from", state.from); set("in", state.in); set("after", state.after);
    set("before", state.before); set("has", state.has);
    if(state.page > 1) u.searchParams.set("page", String(state.page)); else u.searchParams.delete("page");
    history.replaceState(null, "", u);
  }
  function composeQuery(){
    const parts = [];
    const qf = (s) => /\s/.test(s) ? '"' + s + '"' : s;
    if(state.q) parts.push(state.q);
    if(state.from) parts.push("from:" + qf(state.from));
    if(state.in) parts.push("in:" + qf(state.in));
    if(state.after) parts.push("after:" + state.after);
    if(state.before) parts.push("before:" + state.before);
    if(state.has) parts.push("has:" + state.has);
    return parts.join(" ").trim();
  }
  function plainTerms(q){
    return (q || "").replace(/\b(from|in|before|after|during|has):("[^"]*"|\S+)/gi, " ").replace(/\s+/g, " ").trim();
  }
  function fillSelect(id, values, allLabel){
    const sel = $(id);
    const cur = state[id] || "";
    sel.innerHTML = `<option value="">${allLabel}</option>` +
      values.map(v => `<option value="${esc(v)}">${esc(pretty(v))}</option>`).join("");
    sel.value = cur;
  }
  function populateFilters(){
    if(!statsData) return;
    fillSelect("branch", Object.keys(statsData.byBranch || {}).sort(), "All branches");
    fillSelect("sub", Object.keys(statsData.bySub || {}).sort(), "All sources");
  }
  async function loadStats(){
    if(!statsData){
      try { statsData = await (await fetch(API + "/public/stats")).json(); } catch(e){ return; }
      populateFilters();
    }
    if(!state.q) renderStats();
  }
  function scoped(){
    const { branch, sub } = state;
    if(branch && sub) return (statsData.byBranchSub || {})[branch + "|" + sub] || { messages:0, channels:0 };
    if(branch) return (statsData.byBranch || {})[branch] || { messages:0, channels:0 };
    if(sub) return (statsData.bySub || {})[sub] || { messages:0, channels:0 };
    return statsData;
  }
  function renderStats(){
    if(!statsData) return;
    const s = scoped();
    const dot = '<span class="dot">·</span>';
    const parts = [];
    parts.push(`<strong>${(s.messages||0).toLocaleString()}</strong> message${s.messages===1?"":"s"}`);
    if(s.channels) parts.push(`<strong>${s.channels}</strong> channel${s.channels===1?"":"s"}`);
    if(s.earliest && s.latest) parts.push(`${year(s.earliest)}–${year(s.latest)}`);
    const labels = [];
    if(state.branch) labels.push(esc(pretty(state.branch)));
    if(state.sub) labels.push(esc(pretty(state.sub)));
    const prefix = labels.length ? `<strong>${labels.join(" / ")}</strong>${dot}` : "";
    $("status").innerHTML = prefix + parts.join(dot);
  }
  async function run(){
    state.q = $("q").value.trim();
    state.branch = $("branch").value;
    state.sub = $("sub").value;
    state.from = $("fFrom").value.trim();
    state.in = $("fIn").value.trim();
    state.after = $("fAfter").value;
    state.before = $("fBefore").value;
    state.has = $("fHas").value;
    writeUrl();
    const q = composeQuery();
    state.hl = plainTerms(q);
    if(!q){ $("results").innerHTML = ""; $("pager").innerHTML = ""; loadStats(); return; }
    $("status").textContent = "Searching…";
    $("results").innerHTML = "";
    try {
      const params = new URLSearchParams({ q, page: String(state.page), perPage: String(PER_PAGE) });
      if(state.branch) params.set("branch", state.branch);
      if(state.sub) params.set("sub", state.sub);
      const res = await fetch(API + "/public/search?" + params.toString());
      if(!res.ok) throw new Error("HTTP " + res.status);
      render(await res.json());
    } catch (e) {
      $("status").textContent = "Search is unavailable right now. Please try again shortly.";
    }
  }
  function render(data){
    const hits = data.hits || [];
    const total = data.total || 0;
    if(!total){
      $("status").innerHTML = `No results for &ldquo;${esc(state.q)}&rdquo;.`;
      $("results").innerHTML = ""; $("pager").innerHTML = "";
      return;
    }
    const from = (data.page - 1) * data.perPage + 1;
    const to = from + hits.length - 1;
    $("status").innerHTML = `<strong>${total.toLocaleString()}</strong> result(s) for &ldquo;${esc(state.q)}&rdquo;<span class="dot">·</span>showing ${from}–${to}`;
    $("results").innerHTML = hits.map(card).join("");
    renderPager(data);
  }
  function renderPager(data){
    if(data.totalPages <= 1){ $("pager").innerHTML = ""; return; }
    $("pager").innerHTML =
      `<button id="prev" ${data.page<=1?"disabled":""}>← Prev</button>` +
      `<span>Page ${data.page} of ${data.totalPages}</span>` +
      `<button id="next" ${data.page>=data.totalPages?"disabled":""}>Next →</button>`;
    const prev = $("prev"), next = $("next");
    if(prev) prev.onclick = () => { state.page = data.page - 1; run(); scrollTop(); };
    if(next) next.onclick = () => { state.page = data.page + 1; run(); scrollTop(); };
  }
  function scrollTop(){ window.scrollTo({ top: 0, behavior: "smooth" }); }

  let timer = null;
  $("searchForm").addEventListener("submit", (e) => { e.preventDefault(); state.page = 1; run(); });
  $("q").addEventListener("input", () => {
    clearTimeout(timer);
    timer = setTimeout(() => { state.page = 1; run(); }, 350);
  });
  $("branch").addEventListener("change", () => { state.page = 1; run(); });
  $("sub").addEventListener("change", () => { state.page = 1; run(); });
  ["fFrom", "fIn"].forEach((id) => $(id).addEventListener("input", () => {
    clearTimeout(timer);
    timer = setTimeout(() => { state.page = 1; run(); }, 350);
  }));
  ["fAfter", "fBefore", "fHas"].forEach((id) => $(id).addEventListener("change", () => { state.page = 1; run(); }));

  readUrl();
  loadStats().then(() => { if(state.q) run(); });
})();
</script>
</body>
</html>
