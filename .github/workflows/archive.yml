name: Archive Ledger
on:
  workflow_dispatch:
    inputs:
      term:
        description: 'Term slug, e.g. smith-may26'
        required: true
        type: string
      branch:
        description: 'Only this branch (blank = all in channels.csv)'
        required: false
        type: string
      server:
        description: 'Only this server (blank = all)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install DiscordChatExporter CLI
        run: |
          dotnet tool install --global DiscordChatExporter.Cli
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Export, index and sync
        env:
          SOURCE: ledger
          TERM: ${{ inputs.term }}
          BRANCH: ${{ inputs.branch }}
          SERVER: ${{ inputs.server }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          SEARCH_API: ${{ secrets.SEARCH_API }}
          SEARCH_ADMIN_KEY: ${{ secrets.SEARCH_ADMIN_KEY }}
        run: |
          set -euo pipefail
          export PATH="$PATH:$HOME/.dotnet/tools"
          node scripts/sync.mjs

      - name: Commit and push
        env:
          TERM: ${{ inputs.term }}
        run: |
          set -euo pipefail
          git config user.name "Archive Bot"
          git config user.email "archive-bot@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "archive(ledger): $TERM"
          git push
